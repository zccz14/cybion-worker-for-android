name: pr-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        working-directory: rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Rust format
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Rust clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: rust
        run: cargo test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Add Android Rust target
        working-directory: rust
        run: rustup target add aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: cd android && ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
