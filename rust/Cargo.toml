[package]
name = "cybion-worker-android"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "Cybion Worker core for Android"

[lib]
name = "cybion_worker_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
futures-util = "0.3"
hex = "0.4"
libc = "0.2"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
jni = "0.21"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
